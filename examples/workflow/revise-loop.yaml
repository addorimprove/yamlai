# Loop demo (multi-step body). The body is a two-stage sequence, emitted as an
# inline nested workflow (a Workflow is itself a Step). Requires input/output to
# type the nested workflow's schemas.
description: Run a two-stage revise body in a loop until good enough.

input:  { text: string, score: number }
output: { text: string, score: number }

steps:
  - loop:
      until: good-enough
      input:  { text: string, score: number }
      output: { text: string, score: number }
      steps:
        - step: refine
        - step: score
      max_iterations: 4
