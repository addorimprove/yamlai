name: my-mastra-app
agents:
  - support-agent
logger:
  level: info
storage:
  type: libsql
  url: file:./mastra.db
memory:
  last_messages: 20
  semantic_recall:
    embedder: openai/text-embedding-3-small
    top_k: 3
    message_range: { before: 2, after: 1 }
    scope: resource
  working_memory:
