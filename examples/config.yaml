name: my-mastra-app
agents:
  - support-agent
  - research-agent
workflows:                 # registered on the Mastra instance (workflow/<id>.yaml)
  - research-flow          # sequential: research-agent -> rephrase(step) -> support-agent
  - compare-answers        # parallel:   [research-agent | support-agent] -> merge-answers(tool)
  - refine-loop            # loop:       .dountil(refine, good-enough) — single-leaf body
  - draft-loop             # loop:       .dountil(nested [refine, score], good-enough) — multi-step body
logger:
  level: info
storage:
  type: libsql
  url: file:./mastra.db
memory:
  last_messages: 20
  semantic_recall:
    embedder: openai/text-embedding-3-small
    top_k: 3
    message_range: { before: 2, after: 1 }
    scope: resource
  working_memory:
    scope: resource
    template: |
      # User Profile
      - Name:
      - Plan tier:
