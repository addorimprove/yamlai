name: content-assistant
agents:
  - writer-agent
  - editor-agent
workflows:                 # registered on the Mastra instance (workflow/<id>.yaml)
  - draft-flow             # sequential: writer-agent -> brief(step) -> editor-agent
  - compare-drafts         # parallel:   [writer-agent | editor-agent] -> merge-drafts(tool)
  - polish-loop            # loop:       .dountil(refine, good-enough) — single-leaf body
  - revise-loop            # loop:       .dountil(nested [refine, score], good-enough) — multi-step body
logger:
  level: info
storage:
  type: libsql
  url: file:./mastra.db
memory:
  last_messages: 20
  working_memory:
    scope: resource
    template: |
      # Writing Preferences
      - Tone:
      - Audience:
